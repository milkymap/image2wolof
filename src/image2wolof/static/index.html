<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Légendes wolof</title><link rel="icon" href="data:,"><style>
*,*::before,*::after{box-sizing:border-box}
:root{--bg:#f6f5f2;--fg:#1d1d1f;--mut:#6b6b70;--card:#fff;--acc:#0b6e4f;--bd:#ddd;--err:#b3261e;--warn:#a86b00}
@media (prefers-color-scheme:dark){:root{--bg:#161618;--fg:#eee;--mut:#9a9aa0;--card:#202024;--acc:#4fc38f;--bd:#333;--err:#f2867c;--warn:#e0b04a}}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;overflow-x:hidden}
main{max-width:900px;margin:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;min-height:100vh;min-height:100dvh}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:18px;line-height:1.3;margin:0}
#status{color:var(--mut);font-size:13px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:5px;vertical-align:middle}
.dot.ok{background:var(--acc)} .dot.bad{background:var(--err)} .dot.wait{background:var(--warn)}
#apibox{display:none;gap:8px} #apibox.on{display:flex}
#apibox input{flex:1;min-width:0;font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
button{font:inherit;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;min-height:44px}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
button:disabled{opacity:.5;cursor:default}
#pick{display:flex;gap:8px} #pick button{flex:1}
#stage{position:relative;border-radius:10px;background:#000;display:flex;align-items:center;justify-content:center;min-height:200px;overflow:hidden;border:1px dashed var(--bd)}
#stage.has{border:0}
#stage.over{outline:3px solid var(--acc)}
#photo{display:none;width:100%;max-height:62vh;max-height:62dvh;object-fit:contain}
#stage.has #photo{display:block}
#empty{color:#9a9aa0;font-size:15px;padding:24px;text-align:center}
#stage.has #empty{display:none}
#busy{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
#stage.loading #busy{display:flex}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.35);border-top-color:#fff;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#cap{font-size:22px;line-height:1.4;font-weight:600;color:var(--acc);text-align:center;overflow-wrap:anywhere;min-height:1.4em;cursor:copy;margin:0}
#cap.pending{color:var(--mut);font-weight:400;font-style:italic;cursor:default}
#cap.error{color:var(--err);font-weight:400;font-size:15px;cursor:default}
#meta{color:var(--mut);font-size:13px;text-align:center;min-height:1.2em}
@media (max-width:600px){h1{font-size:16px}#cap{font-size:19px}}
</style></head><body><main>
<header><h1>Légendes wolof en direct</h1>
<span id="status"><span class="dot wait" id="dot"></span><span id="statusText">…</span></span></header>
<div id="apibox"><input id="api" type="text" spellcheck="false" aria-label="API"><button id="check">Tester</button></div>
<div id="pick"><button id="gallery" class="primary">Galerie</button><button id="camera">Appareil photo</button></div>
<input id="file" type="file" accept="image/*" hidden><input id="cam" type="file" accept="image/*" capture="environment" hidden>
<div id="stage"><img id="photo" alt=""><div id="empty">Choisis une photo ou prends-en une : sa légende wolof s'affichera ici.</div><div id="busy"><div class="spin"></div></div></div>
<p id="cap"></p>
<div id="meta"></div>
<script>
const $=id=>document.getElementById(id);
// Served by the caption server (http/https): use its own origin. Opened as a local file: remembered API or localhost.
const served=location.protocol.startsWith('http');
let api=served?location.origin:'http://localhost:8000', seq=0, url=null;
if(!served){try{api=localStorage.getItem('api')||api}catch(e){};$('apibox').classList.add('on')}
$('api').value=api;
function setApi(){api=$('api').value.trim().replace(/\/+$/,'');try{localStorage.setItem('api',api)}catch(e){}health()}
$('api').onchange=setApi;$('check').onclick=setApi;
async function health(){
  $('dot').className='dot wait';$('statusText').textContent='connexion…';
  try{const r=await fetch(api+'/health',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const h=await r.json();$('dot').className='dot ok';$('statusText').textContent='en ligne';
  }catch(e){$('dot').className='dot bad';$('statusText').textContent='hors ligne'}
}
health();setInterval(health,15000);
async function caption(f){
  if(!f)return;
  const id=++seq;
  if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);
  $('photo').src=url;$('stage').classList.add('has','loading');
  $('cap').className='pending';$('cap').textContent='génération de la légende…';$('meta').textContent='';
  const body=new FormData();body.append('files',f,f.name||'photo.jpg');const t=performance.now();
  try{const r=await fetch(api+'/caption',{method:'POST',body});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const [x]=await r.json();if(id!==seq)return;   // a newer photo replaced this one
    if(x.error)throw new Error(x.error);
    $('cap').className='';$('cap').textContent=x.caption;
    $('meta').textContent=`légende ${x.ms} ms · total ${Math.round(performance.now()-t)} ms · toucher la légende pour la copier`;
  }catch(e){if(id!==seq)return;$('cap').className='error';$('cap').textContent='Erreur : '+e.message;health()}
  finally{if(id===seq)$('stage').classList.remove('loading')}
}
$('file').onchange=$('cam').onchange=e=>{caption(e.target.files[0]);e.target.value=''};
$('gallery').onclick=()=>$('file').click();$('camera').onclick=()=>$('cam').click();
$('cap').onclick=async()=>{if($('cap').className)return;
  try{await navigator.clipboard.writeText($('cap').textContent);const m=$('meta').textContent;$('meta').textContent='légende copiée';setTimeout(()=>$('meta').textContent=m,1200)}catch(e){}};
// Desktop: drop one image on the page
['dragenter','dragover'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$('stage').classList.add('over')}));
['dragleave','drop'].forEach(t=>document.addEventListener(t,e=>{e.preventDefault();$('stage').classList.remove('over')}));
document.addEventListener('drop',e=>caption([...e.dataTransfer.files].find(f=>f.type.startsWith('image/'))));
</script></main></body></html>
