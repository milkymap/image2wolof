[project]
name = "image2wolof"
version = "0.1.0"
description = "Wolof image captioning: frozen SigLIP2-base encoder + six-layer transformer decoder"
readme = "README.md"
authors = [
    { name = "milkymap", email = "ibrahima.elmokhtar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "numpy==1.26.4",
    "pillow>=11.0.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "sacrebleu==2.6.0",
    "sentencepiece==0.2.3",
    "torch==2.7.0",
    "transformers==4.57.6",
    "uvicorn>=0.30.0",
]

[project.scripts]
image2wolof = "image2wolof:main"

[dependency-groups]
dev = ["httpx>=0.27.0", "pytest>=8.0.0"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
